name: daon2_user_asr
services:
  asr-base:
    image: ${DAON_ASR_IMAGE:?exact ASR image required}
    container_name: daon2_user-asr-base
    cpus: 1.0
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      daon2_user:
        aliases: [asr-base]
    restart: unless-stopped
networks:
  daon2_user:
    external: true
    name: daon2_user_network
